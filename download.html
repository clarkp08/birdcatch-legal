<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download BirdCatch</title>
  <meta name="description" content="BirdCatch: Birding Game. Catch 'em in the Wild!">
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f0; color: #2a2a2a; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 1.6rem; margin: 0 0 6px; }
    p { margin: 0 0 24px; color: #555; }
    .btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
    a.btn { display: block; padding: 14px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; background: #2a2a2a; color: #fff; }
    a.btn.alt { background: #e8e8e0; color: #2a2a2a; }
    .tag { margin-top: 20px; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BirdCatch</h1>
    <p>Catch 'em in the Wild!</p>
    <div class="btns" id="btns">
      <a class="btn" id="ios" href="https://apps.apple.com/app/id6769105114">Download on the App Store</a>
      <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.theclarks.birdcatch">Get it on Google Play</a>
    </div>
    <div class="tag">Free bird photography scoring game</div>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || "";
      var ios = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var android = /android/i.test(ua);
      var target = null;
      if (ios) target = document.getElementById("ios").href;
      else if (android) target = document.getElementById("android").href;
      if (target) window.location.replace(target);
    })();
  </script>
</body>
</html>
